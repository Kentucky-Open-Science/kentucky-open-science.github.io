name: KOS lease expiry

# Hourly sweep: warn holders whose lease is about to expire, return expired
# leases to the pool. Logic in .github/kos/expiry.js.
# Note: GitHub pauses scheduled workflows in repositories with no commits for
# 60 days; the leaderboard commit keeps this one alive, or run it by hand.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: kos-lease-expiry
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const expiry = require(`${process.env.GITHUB_WORKSPACE}/.github/kos/expiry.js`);
            const summary = await expiry({ github, context, core });
            await core.summary
              .addHeading('Lease sweep')
              .addRaw(`checked ${summary.checked}; expired: ${summary.expired.join(', ') || '-'}; warned: ${summary.warned.join(', ') || '-'}; repaired: ${summary.repaired.join(', ') || '-'}`)
              .write();
